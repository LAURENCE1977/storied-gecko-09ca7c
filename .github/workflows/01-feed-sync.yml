name: 01 - Feed Sync Agent
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node scripts/sync-feeds.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "LC Sync Bot"
          git config user.email "bot@laurencecolborne.co.uk"
          git add site-data.json public/feeds/
          git diff --staged --quiet || (git commit -m "chore: auto-sync feeds [bot]" && git push)
