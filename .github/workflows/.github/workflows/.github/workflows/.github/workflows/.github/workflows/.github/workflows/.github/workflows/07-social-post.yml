name: 07 - Social Post Agent
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
jobs:
  social:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/social-post.js
      - run: |
          git config user.name "LC Bot"
          git config user.email "bot@laurencecolborne.co.uk"
          git add social-log.json
          git diff --staged --quiet || (git commit -m "chore: social post [bot]" && git push)
