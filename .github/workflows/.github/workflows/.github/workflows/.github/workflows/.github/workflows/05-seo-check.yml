name: 05 - SEO Check Agent
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/seo-check.js
      - run: |
          git config user.name "LC Bot"
          git config user.email "bot@laurencecolborne.co.uk"
          git add seo-report.json
          git diff --staged --quiet || (git commit -m "chore: seo report [bot]" && git push)
